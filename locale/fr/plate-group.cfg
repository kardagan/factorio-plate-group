[item-group-name]
plate-group=Plaques & Panneaux

[mod-setting-name]
plate-group-subgroups=Sous-groupes à déplacer
plate-group-items=Items individuels à déplacer
plate-group-order=Clé de tri du groupe

[mod-setting-description]
plate-group-subgroups=Liste de noms d'item-subgroup séparés par des virgules, déplacés dans l'onglet « Plaques & Panneaux ». Les valeurs par défaut couvrent Text Plates et Display Plates.
plate-group-items=Liste de noms d'items séparés par des virgules, déplacés dans un sous-groupe fourre-tout. À utiliser pour les mods qui ne déclarent pas de sous-groupe dédié.
plate-group-order=Clé de tri qui décide de la position de l'onglet. « d-b » le place après Combat et avant Fluides.
