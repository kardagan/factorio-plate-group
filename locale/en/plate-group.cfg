[item-group-name]
plate-group=Plates & Signs

[mod-setting-name]
plate-group-subgroups=Subgroups to move
plate-group-items=Individual items to move
plate-group-order=Group order string

[mod-setting-description]
plate-group-subgroups=Comma-separated list of item-subgroup names moved into the "Plates & Signs" tab. Defaults cover Text Plates and Display Plates.
plate-group-items=Comma-separated list of item names moved into a catch-all subgroup. Use this for mods that do not declare a dedicated subgroup.
plate-group-order=Sort key deciding where the tab sits. "d-b" places it after Combat and before Fluids.
